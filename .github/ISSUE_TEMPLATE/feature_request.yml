name: Feature request
description: Suggest an idea or enhancement for KageOps Core
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the use case or pain point. Focus on the "why".
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would you like to see happen?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you've thought about, and why they fall short.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Orchestrator (Sensei / phases / gates)
        - Agents (the Autonauts)
        - AI adapter / providers
        - Headless runner / CLI
        - Command Center (desktop UI)
        - Database / event bus
        - Other
    validations:
      required: true
  - type: checkboxes
    id: scope
    attributes:
      label: Scope check
      options:
        - label: This is about the open-source engine (not the commercial KageOps Cloud layer — see OPEN-CORE.md).
          required: true
