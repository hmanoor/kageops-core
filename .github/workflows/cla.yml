name: CLA Assistant

# Automates the one-time Contributor License Agreement sign-off described in
# CONTRIBUTING.md / CLA.md. On a contributor's first PR the bot comments with a
# link; the contributor signs by commenting the phrase below, and the signature
# is recorded in .github/cla/signatures.json for all future PRs.
#
# SETUP (one-time, operator): create a fine-grained/classic PAT with `repo`
# scope on an account that can push to this repo, and add it as the repository
# secret `PERSONAL_ACCESS_TOKEN` (Settings → Secrets and variables → Actions).
# Until that secret exists the workflow is inert — it only runs on PRs.

on:
  issue_comment:
    types: [created]
  pull_request_target:
    types: [opened, closed, synchronize]

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write

jobs:
  cla-assistant:
    runs-on: ubuntu-latest
    steps:
      - name: CLA Assistant
        if: >-
          (github.event.comment.body == 'recheck' ||
           github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA') ||
          github.event_name == 'pull_request_target'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PERSONAL_ACCESS_TOKEN: ${{ secrets.PERSONAL_ACCESS_TOKEN }}
        with:
          path-to-signatures: '.github/cla/signatures.json'
          path-to-document: 'https://github.com/hmanoor/kageops-core/blob/main/CLA.md'
          branch: 'main'
          allowlist: 'dependabot[bot],github-actions[bot]'
          custom-notsigned-prcomment: >-
            Thank you for your contribution! Before we can merge it, please read
            our [Contributor License Agreement](https://github.com/hmanoor/kageops-core/blob/main/CLA.md)
            and sign it by posting the following comment:
          custom-pr-sign-comment: 'I have read the CLA Document and I hereby sign the CLA'
          custom-allsigned-prcomment: 'All contributors have signed the CLA. ✅'
