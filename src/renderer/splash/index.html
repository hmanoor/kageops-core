<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <title>KageOps</title>
    <link rel="stylesheet" href="splash.css" />
</head>
<body>
    <div class="splash">
        <!--
            Mark C · Kanji-fold (CANONICAL)
            Source: docs/design_pack/wave-2-mission-control/design-system/preview/Brand Mark + Loader.html
            Each <path> draws itself in sequence to form the calligraphic loader.
        -->
        <svg class="kanji-fold" viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg" aria-label="KageOps">
            <path class="kf-stroke kf-1" d="M14 16 L34 16 L34 32 L18 32"/>
            <path class="kf-stroke kf-2" d="M22 22 L30 22"/>
            <path class="kf-stroke kf-3" d="M40 14 L40 44"/>
            <path class="kf-stroke kf-4" d="M44 18 L48 14"/>
            <path class="kf-stroke kf-5" d="M44 30 L48 26"/>
            <path class="kf-stroke kf-6" d="M44 42 L48 38"/>
            <path class="kf-foot"        d="M22 40 L34 40 L28 50 Z"/>
        </svg>

        <div class="splash-wordmark">
            <span class="wm-kage">Kage</span><span class="wm-ops">Ops</span>
        </div>

        <div class="splash-tagline">Multi-agent orchestration</div>
    </div>
</body>
</html>
